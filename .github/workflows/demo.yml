name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: haritalari uret
        run: |
          node bin/tg.mjs draw . --view symbol --max 200 --no-open --out site/index.html --lang en
          node bin/tg.mjs draw . --view file --no-open --out site/dosya.html --lang en
          node bin/tg.mjs ciz . --gorunum simge --enfazla 200 --acma --cikti site/tr.html --dil tr
      - name: paylasim etiketleri
        run: |
          node -e '
          const fs = require("fs"), f = "site/index.html";
          const m = [
            "<meta name=\"description\" content=\"talk-graph run on its own source: a navigable architecture map generated from a codebase, in one HTML file.\">",
            "<meta property=\"og:title\" content=\"talk-graph — a map of a codebase in one HTML file\">",
            "<meta property=\"og:image\" content=\"https://repository-images.githubusercontent.com/1362915896/71008330-9d44-44f7-8c18-cd5930727029\">",
            "<meta name=\"twitter:card\" content=\"summary_large_image\">"
          ].join("");
          fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/<title>[^<]*<.title>/,"<title>talk-graph — a map of a codebase in one HTML file</title>" + m));
          '
      - name: tek dosya mi
        run: |
          for f in site/index.html site/dosya.html site/tr.html; do
            test -f "$f"
            if grep -qE '<(script[^>]+src=|link[^>]+href=)' "$f"; then
              echo "$f dis kaynak yukluyor"; exit 1
            fi
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  yayinla:
    needs: uret
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v5
