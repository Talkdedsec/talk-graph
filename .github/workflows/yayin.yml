name: yayin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: testler
        run: node --test
      - name: surum etiketle uyusuyor mu
        run: |
          paket=$(node -p "require('./package.json').version")
          etiket="${GITHUB_REF_NAME#v}"
          if [ "$paket" != "$etiket" ]; then
            echo "package.json $paket ile etiket $etiket uyusmuyor"; exit 1
          fi
      - name: yayinla
        run: npm publish
