name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: testler
        run: node --test
      - name: kendi haritasini uret
        run: node bin/tg.mjs . --acma --cikti cikti/talk-graph.html
      - name: cikti tek dosya mi
        shell: bash
        run: |
          test -f cikti/talk-graph.html
          if grep -qE '<(script[^>]+src=|link[^>]+href=)' cikti/talk-graph.html; then
            echo "cikti dis kaynak yukluyor"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: harita
          path: cikti/talk-graph.html
